                                        max:
                                          type: number
                                    D_lim_eff:
                                      type: number
                                    b_prior:
                                      type: number
                                    b_strength:
                                      type: string
                                    enforce_sw:
                                      type: boolean
                                axisCombo:
                                  type: string
                                basePhase:
                                  type: string
                                valueRange:
                                  type: object
                                  properties:
                                    min:
                                      type: number
                                    max:
                                      type: number
                                timeDict:
                                  type: object
                                  properties:
                                    mode:
