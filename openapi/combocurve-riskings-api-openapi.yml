components:
  parameters:
    takeParam:
      name: take
      in: query
      description: max records to return
      schema:
        type: integer
        format: int32
        default: 25
        maximum: 200
        minimum: 1
    cursorParam:
      name: cursor
      in: query
      description: used in pagination to get the next page
      schema:
        type: string
    sortParam:
      name: sort
      in: query
      description: field to sort by, including + or - at the beginning for ascending or descending order, respectively
      schema:
        type: string
    skipParam:
      name: skip
      in: query
      description: number of items to skip
      schema:
        type: integer
        format: int32
        default: 0
  schemas:
    RiskingsStatus:
      type: object
      required:
      - status
      - code
      properties:
        status:
          type: string
        code:
          type: integer
        name:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntry'
      example:
        status: Success
        code: 200
        name: test
    ErrorEntry:
      required:
      - name
      - message
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        location:
          type: string
      example:
        name: ValidationError
        message: The field 'id' is required.
        location: In body of request at position [0]
    ShutInDateCriteria:
      type: object
      required:
      - startDate
      - endDate
      properties:
        startDate:
          type: string
          format: date
          description: Start date of shut-in period
        endDate:
          type: string
          format: date
          description: End date of shut-in period
    ShutInRow:
      type: object
      properties:
        phase:
          type: string
          enum:
          - all
          - oil
          - gas
          - water
        offsetToAsOf:
          $ref: '#/components/schemas/ShutInOffsetToAsOfCriteria'
        dates:
          $ref: '#/components/schemas/ShutInDateCriteria'
        repeatRangeOfDates:
          type: string
          enum:
          - no_repeat
          - monthly
          - yearly
        totalOccurrences:
          type: integer
        unit:
          type: string
          enum:
          - day
          - month
        multiplier:
          type: number
        scalePostShutInEndCriteria:
          type: string
          enum:
          - offset_to_as_of_date
          - dates
          - econ_limit
        scalePostShutInEnd:
          type: string
        fixedExpense:
          type: boolean
        capex:
          type: boolean
    RiskingMultiplierArray:
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RiskingMultiplierRow'
    RiskingsList:
      type: array
      items:
        $ref: '#/components/schemas/Riskings'
      maxItems: 200
    RiskingsInput:
      type: object
      required:
      - name
      - unique
      properties:
        name:
          type: string
          description: Name
        unique:
          type: boolean
          description: Unique
        scenario:
          type: string
          description: Scenario ID
        well:
          type: string
          description: Well ID
        risking:
          $ref: '#/components/schemas/RiskingModel'
        shutIn:
          $ref: '#/components/schemas/ShutInModel'
    RiskingsMultiStatusResponse:
      type: object
      properties:
        generalErrors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntry'
        results:
          type: array
          items:
            $ref: '#/components/schemas/RiskingsStatus'
        failedCount:
          type: integer
        successCount:
          type: integer
      example:
        generalErrors:
        - name: ValidationError
          message: The field 'name' is required.
          location: In body of request at position [0]
        - name: ValidationError
          message: The field 'unique' is required.
          location: In body of request at position [2]
        results:
        - status: Success
          code: 200
          name: test
        - status: Success
          code: 200
          name: test1
        failedCount: 2
        successCount: 2
    EntireWellLifeCriteria:
      type:
      - string
      - 'null'
      enum:
      - Flat
    Riskings:
      type: object
      required:
      - name
      - unique
      properties:
        name:
          type: string
          description: Name
        unique:
          type: boolean
          description: Unique
        id:
          type: string
          description: ID
        copiedFrom:
          type: string
          description: Copied From
        scenario:
          type: string
          description: Scenario ID
        tags:
          type: array
          items:
            type: string
            description: Tag ID
        well:
          type: string
          description: Well ID
        createdAt:
          type: string
          format: date
          description: Creation Date
        updatedAt:
          type: string
          format: date
          description: Updated At
        createdBy:
          type: string
          description: Created By
        lastUpdatedBy:
          type: string
          description: Last Updated By
        risking:
          $ref: '#/components/schemas/RiskingModel'
        shutIn:
          $ref: '#/components/schemas/ShutInModel'
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
    RiskingsInputList:
      type: array
      items:
        $ref: '#/components/schemas/RiskingsInput'
      maxItems: 500
    RiskingModel:
      type: object
      required:
      - riskProd
      - riskNglDripCondViaGasRisk
      - oil
      - gas
      - ngl
      - dripCondensate
      - water
      properties:
        riskProd:
          type: boolean
        riskNglDripCondViaGasRisk:
          type: boolean
        oil:
          $ref: '#/components/schemas/RiskingMultiplierArray'
        gas:
          $ref: '#/components/schemas/RiskingMultiplierArray'
        ngl:
          $ref: '#/components/schemas/RiskingMultiplierArray'
        dripCondensate:
          $ref: '#/components/schemas/RiskingMultiplierArray'
        water:
          $ref: '#/components/schemas/RiskingMultiplierArray'
    StartEndPeriodCriteria:
      type:
      - number
      - 'null'
      description: Interval
    ShutInOffsetToAsOfCriteria:
      type: object
      required:
      - start
      - end
      properties:
        start:
          type: number
        end:
          type: number
    ShutInModel:
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ShutInRow'
    StartEndDatesCriteria:
      type:
      - string
      - 'null'
      format: date
      description: Start date
    SeasonalCriteria:
      type:
      - string
      - 'null'
      enum:
      - Jan
      - Feb
      - Mar
      - Apr
      - May
      - Jun
      - Jul
      - Aug
      - Sep
      - Oct
      - Nov
      - Dec
    RiskingMultiplierRow:
      type: object
      required:
      - multiplier
      properties:
        multiplier:
          type: number
        entireWellLife:
          $ref: '#/components/schemas/EntireWellLifeCriteria'
        offsetToFpd:
          $ref: '#/components/schemas/StartEndPeriodCriteria'
        offsetToAsOf:
          $ref: '#/components/schemas/StartEndPeriodCriteria'
        offsetToFirstSegment:
          $ref: '#/components/schemas/StartEndPeriodCriteria'
        offsetToEndHistory:
          $ref: '#/components/schemas/StartEndPeriodCriteria'
        dates:
          $ref: '#/components/schemas/StartEndDatesCriteria'
        seasonal:
          $ref: '#/components/schemas/SeasonalCriteria'
  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
x-google-management:
  metrics:
  - name: read-request-rate
    displayName: Read Request Rate
    valueType: INT64
    metricKind: DELTA
  - name: write-request-rate
    displayName: Write Request Rate
    valueType: INT64
    metricKind: DELTA
  quota:
    limits:
    - name: read-request-rate-limit
      metric: read-request-rate
      unit: 1/min/{project}
      values:
