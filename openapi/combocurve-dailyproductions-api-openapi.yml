openapi: 3.2.0
info:
  title: ComboCurve REST Daily Productions API
  version: 1.0.0
servers:
- url: https://api.combocurve.com
security:
- api-key: []
  service-account-key: []
tags:
- name: DailyProductions
paths:
  /v1/daily-productions:
    delete:
      description: Delete the daily productions documents that match the given filters.
      operationId: delete-daily-productions
      parameters:
      - name: well
        in: query
        description: filter by well ID
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        description: filter by startDate
        schema:
          type: string
      - name: endDate
        in: query
        description: filter by endDate
        schema:
          type: string
      responses:
        '204':
          description: OK
          headers:
            X-Delete-Count:
              description: The number of records that match the given filters and were deleted.
              schema:
                type: integer
        '400':
          description: Bad Request. There is something wrong with the request data.
      tags:
      - DailyProductions
      summary: Delete daily productions
      x-summary-source: derived
    head:
      description: Returns metadata about the existing daily production documents in the company scope.
      operationId: head-daily-productions
      parameters:
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      - name: createdAt
        in: query
        description: filter by createdAt - Operator values are [lt] = less than, [le] = less than or equal, [gt] = greater than, [ge] = greater than or equal, no operator = equal. Example createdAt[gt]=2018-01-01T00:00:00Z
        x-allow-parameter-operator: true
        schema:
          type: string
          format: date
      - name: date
        in: query
        description: filter by date
        x-allow-parameter-operator: true
        schema:
          type: string
          format: date
      - name: well
        in: query
        description: filter by well
        x-allow-multiple: true
        x-example: 123456789abcdef012345678
        schema:
          type: string
      - name: updatedAt
        in: query
        description: filter by updatedAt - Operator values are [lt] = less than, [le] = less than or equal, [gt] = greater than, [ge] = greater than or equal, no operator = equal. Example updatedAt[gt]=2018-01-01T00:00:00Z
        x-allow-parameter-operator: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: Indicates a typed relationship with another resource, where the relation type is defined by RFC 5988. We include the relationships next, prev, first and last, which can be used to move between pages of the list of results.
              schema:
                type: string
            X-Query-Count:
              description: The number of records in this resource. When filters are provided only matching records are counted.
              schema:
                type: integer
        '400':
          description: Bad Request. There is something wrong with the request data.
      tags:
      - DailyProductions
      summary: Head daily productions
      x-summary-source: derived
