        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  forecastType:
                    type: string
                  project:
                    type: string
                  forecastScope:
                    type: object
                    properties:
                      auto:
                        type: boolean
                      proximity:
                        type: boolean
                  resolution:
                    type: string
                  overwriteManual:
                    type: boolean
                  automaticForecast:
                    type: object
                    properties:
                      streamConfigurations:
                        type: array
