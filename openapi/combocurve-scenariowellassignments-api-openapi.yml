openapi: 3.2.0
info:
  title: ComboCurve REST Scenario Well Assignments API
  version: 1.0.0
servers:
- url: https://api.combocurve.com
security:
- api-key: []
  service-account-key: []
tags:
- name: ScenarioWellAssignments
paths:
  /v1/projects/{projectId}/scenarios/{scenarioId}/well-assignments:
    get:
      operationId: get-scenario-wells-read
      parameters:
      - in: path
        name: scenarioId
        required: true
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioWellsReadOKResponse'
        '404':
          description: NotFound Response
      tags:
      - ScenarioWellAssignments
      summary: Get scenario wells read
      x-summary-source: derived
    post:
      operationId: post-scenario-wells-upsert
      parameters:
      - in: path
        name: scenarioId
        required: true
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '207':
          description: MultiStatus Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioWellsUpsertMultiStatusResponse'
              example:
                failedCount: 1
                generalErrors:
                - chosenID: chosen_id
                  location: .person.name
                  message: The field name is required
                  name: ValidationError
                results:
                - chosenID: chosen_id
                  code: 201
                  status: created
                successCount: 1
        '400':
          description: BadRequest Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioWellsUpsertBadRequestResponse'
              example:
                chosenID: chosen_id
                location: people.age
                message: The field age is required
                name: ValidationError
        '404':
          description: NotFound Response
      tags:
      - ScenarioWellAssignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioWellsUpsertStringList'
        required: true
      summary: Post scenario wells upsert
      x-summary-source: derived
    put:
      operationId: put-scenario-wells-upsert
      parameters:
      - in: path
        name: scenarioId
        required: true
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      responses:
        '207':
          description: MultiStatus Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioWellsUpsertMultiStatusResponse'
              example:
                failedCount: 1
                generalErrors:
                - chosenID: chosen_id
                  location: .person.name
                  message: The field name is required
                  name: ValidationError
                results:
                - chosenID: chosen_id
                  code: 201
                  status: created
                successCount: 1
        '400':
          description: BadRequest Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioWellsUpsertBadRequestResponse'
              example:
                chosenID: chosen_id
                location: people.age
                message: The field age is required
                name: ValidationError
        '404':
          description: NotFound Response
      tags:
      - ScenarioWellAssignments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioWellsUpsertStringList'
        required: true
      summary: Put scenario wells upsert
      x-summary-source: derived
    delete:
      operationId: delete-scenario-wells-delete
      parameters:
      - in: path
        name: scenarioId
        required: true
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        schema:
          type: string
      - in: query
        name: wells
        required: true
        x-allow-multiple: true
        schema:
          type: string
      responses:
        '204':
          description: NoContent Response
          headers:
            x-delete-count:
              schema:
                type: number
        '404':
          description: NotFound Response
      tags:
      - ScenarioWellAssignments
      summary: Delete scenario wells delete
      x-summary-source: derived
components:
  schemas:
    ScenarioWellsReadOKResponse:
      type: object
      properties:
        wells:
          type: array
          description: wells
          items:
            type: string
      example:
        wells:
        - 5e272d72b78910dd2a1d5c16
    ScenarioWellsUpsertStringList:
      type: array
      items:
        type: string
    ScenarioWellsUpsertBadRequestResponse:
      type: object
      properties:
        chosenID:
          type: string
          description: chosenID
        location:
          type: string
          description: location
        message:
          type: string
          description: message
        name:
          type: string
          description: name
      example:
        chosenID: chosen_id
        location: people.age
        message: The field age is required
        name: ValidationError
    ScenarioWellsUpsertMultiStatusResponse:
      type: object
      properties:
        failedCount:
          type: integer
          description: failedCount
        generalErrors:
          type: array
          description: generalErrors
          items:
            $ref: '#/components/schemas/ScenarioWellsUpsertGeneralErrorsOutput'
        results:
          type: array
          description: results
          items:
            $ref: '#/components/schemas/ScenarioWellsUpsertResultsOutput'
        successCount:
          type: integer
          description: successCount
      example:
        failedCount: 1
        generalErrors:
        - chosenID: chosen_id
          location: .person.name
          message: The field name is required
          name: ValidationError
        results:
        - chosenID: chosen_id
          code: 201
          status: created
        successCount: 1
    ScenarioWellsUpsertGeneralErrorsOutput:
      type: object
      properties:
        chosenID:
          type: string
          description: chosenID
        location:
          type: string
          description: location
        message:
          type: string
          description: message
        name:
          type: string
          description: name
      example:
        chosenID: chosen_id
        location: .person.name
        message: The field name is required
        name: ValidationError
    ScenarioWellsUpsertResultsOutput:
      type: object
      properties:
        chosenID:
          type: string
          description: chosenID
        code:
          type: integer
          description: code
        status:
          type: string
          description: status
      example:
        chosenID: chosen_id
        code: 201
        status: created
  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
x-google-management:
  metrics:
  - name: read-request-rate
    displayName: Read Request Rate
    valueType: INT64
    metricKind: DELTA
  - name: write-request-rate
    displayName: Write Request Rate
    valueType: INT64
    metricKind: DELTA
  quota:
    limits:
    - name: read-request-rate-limit
      metric: read-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 800
    - name: write-request-rate-limit
      metric: write-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 200
