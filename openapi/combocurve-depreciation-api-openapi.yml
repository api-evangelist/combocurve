components:
  schemas:
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
    DepreciationModel:
      type: object
      required:
      - modelType
      properties:
        modelType:
          type: string
          enum:
          - depletion
          - depreciation
        prebuilt:
          type: string
        taxCredit:
          type: number
        tangibleImmediateDepletion:
          type: number
        intangibleImmediateDepletion:
          type: number
        tangibleDepletionModel:
          type: string
          enum:
          - unit_of_production_major
          - unit_of_production_BOE
          - ecl
          - fpd
          - never
        intangibleDepletionModel:
          type: string
          enum:
          - unit_of_production_major
          - unit_of_production_BOE
          - ecl
          - fpd
          - never
        tcjaBonus:
          type: boolean
        bonusDepreciation:
          type: array
          maxItems: 1
          minItems: 1
          items:
            $ref: '#/components/schemas/BonusDepreciationObject'
        depreciation:
          type: array
          maxItems: 1
          minItems: 100
          items:
            $ref: '#/components/schemas/DepreciationObject'
    DepreciationInput:
      type: object
      required:
      - name
      - unique
      properties:
        name:
          type: string
          description: Name
        unique:
          type: boolean
          description: Unique
        scenario:
          type: string
          description: Scenario ID
        well:
          type: string
          description: Well ID
        depreciation:
          $ref: '#/components/schemas/InputDepreciationModel'
      example:
        name: rest-api-test
        unique: false
        depreciation:
          modelType: depreciation
          taxCredit: 0
          tcjaBonus: false
          bonusDepreciation:
          - tangibleBonusDepreciation: 0
            intangibleBonusDepreciation: 0
          depreciation:
          - tanFactor: 0
            intanFactor: 0
    DepreciationObject:
      type: object
      properties:
        year:
          type: number
        tanFactor:
          type: number
        tanCumulative:
          type: number
        intanFactor:
          type: number
        intanCumulative:
          type: number
    ErrorEntry:
      required:
      - name
      - message
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        location:
          type: string
      example:
        name: ValidationError
        message: The field 'id' is required.
        location: In body of request at position [0]
    InputDepreciationModel:
      type: object
      required:
      - modelType
      properties:
        modelType:
          type: string
          enum:
          - depletion
          - depreciation
        taxCredit:
          type: number
        tangibleImmediateDepletion:
          type: number
        intangibleImmediateDepletion:
          type: number
        tangibleDepletionModel:
          type: string
          enum:
          - unit_of_production_major
          - unit_of_production_BOE
          - ecl
          - fpd
          - never
        intangibleDepletionModel:
          type: string
          enum:
          - unit_of_production_major
          - unit_of_production_BOE
          - ecl
          - fpd
          - never
        tcjaBonus:
          type: boolean
        bonusDepreciation:
          type: array
          maxItems: 1
          minItems: 1
          items:
            $ref: '#/components/schemas/BonusDepreciationObject'
        depreciation:
          type: array
          maxItems: 1
          minItems: 100
          items:
            $ref: '#/components/schemas/InputDepreciationObject'
    InputDepreciationObject:
      type: object
      required:
      - intanFactor
      - tanFactor
      properties:
        intanFactor:
          type: number
        tanFactor:
          type: number
    DepreciationStatus:
      type: object
      required:
      - status
      - code
      properties:
        status:
          type: string
        code:
          type: integer
        name:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntry'
      example:
        status: Success
        code: 200
        name: test
