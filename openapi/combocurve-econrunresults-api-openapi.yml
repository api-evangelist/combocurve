openapi: 3.2.0
info:
  title: ComboCurve REST Econ Run Results API
  version: 1.0.0
servers:
- url: https://api.combocurve.com
security:
- api-key: []
  service-account-key: []
tags:
- name: EconRunResults
paths:
  /v1/projects/{projectId}/scenarios/{scenarioId}/econ-runs/{econRunId}/monthly-econ-results:
    get:
      description: Returns econ monthly result columns that matches the provided econ run id.
      operationId: get-monthly-econ-result-by-id
      parameters:
      - in: path
        name: econRunId
        required: true
        description: Econ Run Id
        schema:
          type: string
      - in: path
        name: projectId
        required: true
        description: Project Id
        schema:
          type: string
      - in: path
        name: scenarioId
        required: true
        description: Scenario Id
        schema:
          type: string
      - in: query
        name: columns
        required: true
        description: List of columns separated by commas, do not follow commas with spaces, e.g. "column1,column2"
        schema:
          type: string
      - in: query
        name: startDate
        required: false
        description: Date at which to start the returned monthly result, e.g. "2019-01-01"
        schema:
          type: string
      - in: query
        name: endDate
        required: false
        description: Date at which to end the returned monthly result, e.g. "2020-01-01"
        schema:
          type: string
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconRunResult'
        '400':
          description: Bad Request. There is something wrong with the request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                name: ValidationError
                message: The field 'id' is required.
                details:
                  location: In body of request at position [0]
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                name: ValidationError
                message: The field 'id' is required.
                details:
                  location: In body of request at position [0]
      tags:
      - EconRunResults
      x-google-quota:
        metricCosts:
          read-request-rate: 1
      summary: Get monthly econ result by id
      x-summary-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
