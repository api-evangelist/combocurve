openapi: 3.2.0
info:
  title: ComboCurve REST User Resource Roles API
  version: 1.0.0
servers:
- url: https://api.combocurve.com
security:
- api-key: []
  service-account-key: []
tags:
- name: UserResourceRoles
paths:
  /v1/users/roles:
    get:
      description: Returns a list of user resource role documents.
      operationId: get-users-roles
      parameters:
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/cursorParam'
      - name: userId
        in: query
        description: filter by userId
        schema:
          type: string
      - name: email
        in: query
        description: filter by user email
        schema:
          type: string
      - name: project
        in: query
        description: filter by project
        schema:
          type: string
      - name: role
        in: query
        description: filter by role
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: Indicates a typed relationship with another resource, where the relation type is defined by RFC 5988. We include the relationships next, prev, first and last, which can be used to move between pages of the list of results.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResourceRolesList'
              example:
              - userId: 5f51a46dd1986a0012058e01
                firstName: John
                lastName: Doe
                email: j.doe@example.com
                resourceRoles:
                - resourceId: 6064c19e2c3fc60012909a50
                  resourceType: project
                  roles:
                  - admin
                  - user
        '400':
          description: Bad Request. There is something wrong with the request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                name: ValidationError
                message: The field 'id' is required.
                details:
                  location: In body of request at position [0]
      tags:
      - UserResourceRoles
      x-google-quota:
        metricCosts:
          read-request-rate: 1
      summary: Get users roles
      x-summary-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
    UserResourceRolesList:
      type: array
      items:
        $ref: '#/components/schemas/UserResourceRoles'
      maxItems: 25
      example:
      - userId: 5f51a46dd1986a0012058e01
        firstName: John
        lastName: Doe
        email: j.doe@example.com
        resourceRoles:
        - resourceId: 6064c19e2c3fc60012909a50
          resourceType: project
          roles:
          - admin
          - user
    UserResourceRoles:
      type: object
      properties:
        userId:
          type: string
          description: User ID
        firstName:
          type: string
          description: User first name
        lastName:
          type: string
          description: User last name
        email:
          type: string
          description: user email
        resourceRoles:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRoles'
      example:
        userId: 5f51a46dd1986a0012058e01
        firstName: John
        lastName: Doe
        email: j.doe@example.com
        resourceRoles:
        - resourceId: 6064c19e2c3fc60012909a50
          resourceType: project
          roles:
          - admin
          - user
    ResourceRoles:
      type: object
      properties:
        resourceId:
          type: string
          description: Resource ID
        resourceType:
          type: string
          description: Resource type
        roles:
          type: array
          items:
            type: string
          description: Roles
  parameters:
    takeParam:
      name: take
      in: query
      description: max records to return
      schema:
        type: integer
        format: int32
        default: 25
        maximum: 200
        minimum: 1
    skipParam:
      name: skip
      in: query
      description: number of items to skip
      schema:
        type: integer
        format: int32
        default: 0
    cursorParam:
      name: cursor
      in: query
      description: used in pagination to get the next page
      schema:
        type: string
    sortParam:
      name: sort
      in: query
      description: field to sort by, including + or - at the beginning for ascending or descending order, respectively
      schema:
        type: string
  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
x-google-management:
  metrics:
  - name: read-request-rate
    displayName: Read Request Rate
    valueType: INT64
    metricKind: DELTA
  - name: write-request-rate
    displayName: Write Request Rate
    valueType: INT64
    metricKind: DELTA
  quota:
    limits:
    - name: read-request-rate-limit
      metric: read-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 800
    - name: write-request-rate-limit
      metric: write-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 200
x-provenance:
  method: harvested
  publisher: ComboCurve
  source: https://storage.googleapis.com/beta-combocurve-api-docs/openapi-spec.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
