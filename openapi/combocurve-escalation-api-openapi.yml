components:
  schemas:
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
    EscalationsInputList:
      type: array
      items:
        $ref: '#/components/schemas/EscalationsInput'
      maxItems: 500
      example:
      - name: Test
        scenario: 63b8571d70ed63f50bd6d63f
        unique: true
        well: 63b85759e1d7eb4e31579f51
        escalation:
          rows:
          - pctPerYear: 5
            monthPeriod:
              start: 1
              end: 24
              period: 24
          - pctPerYear: 0
            monthPeriod:
              start: 25
              end: 30
              period: 6
          escalationFrequency: monthly
          calculationMethod: compound
    ErrorEntry:
      required:
      - name
      - message
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        location:
          type: string
      example:
        name: ValidationError
        message: The field 'id' is required.
        location: In body of request at position [0]
    EscalationsList:
      type: array
      items:
        $ref: '#/components/schemas/Escalations'
      maxItems: 200
      example:
      - id: 5e272d39b78910dd2a1bd8fe
        copiedFrom: 63b856e816f758cc5b0f1106
        name: Test
        scenario: 63b8571d70ed63f50bd6d63f
        tags:
        - 63b85737ff846cee7b1f6fdc
        unique: true
        well: 63b85759e1d7eb4e31579f51
        createdAt: '2020-01-21T16:58:08.986Z'
        updatedAt: '2020-01-21T17:58:08.986Z'
        createdBy: 63b857cb68f3b96efc700998
        lastUpdatedBy: 63b857cb68f3b96efc700998
        escalation:
          rows:
          - pctPerYear: 5
            monthPeriod:
              start: 1
              end: 24
              period: 24
          - pctPerYear: 0
            monthPeriod:
              start: 25
              end: 30
              period: 6
          escalationFrequency: monthly
          calculationMethod: compound
    StartEndPeriodCriteria:
      type:
      - number
      - 'null'
      description: Interval
    EscalationsMultiStatusResponse:
      type: object
      properties:
        generalErrors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntry'
        results:
          type: array
          items:
            $ref: '#/components/schemas/EscalationsStatus'
        failedCount:
          type: integer
        successCount:
          type: integer
      example:
        generalErrors:
        - name: ValidationError
          message: The field 'name' is required.
          location: In body of request at position [0]
        - name: ValidationError
          message: The field 'unique' is required.
          location: In body of request at position [2]
        results:
        - status: Success
          code: 200
          name: test
        - status: Success
          code: 200
          name: test1
        failedCount: 2
        successCount: 2
    EscalationModel:
      type: object
      required:
      - rows
      - escalationFrequency
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/EscalationRow'
        escalationFrequency:
          type: string
          description: Frequency of escalation interval
        calculationMethod:
          type: string
          description: How the escalation is calculated
        adjustFromDate:
          type: string
          description: Reference date for escalation adjustment (optional). Controls how start dates are interpreted for escalation calculations.
          enum:
          - date
          - fpd
          - asOf
        adjustStartDate:
          type: string
          format: date
          description: Custom start date for escalation. REQUIRED when adjustFromDate is 'date', and not allowed otherwise.
    StartEndDatesCriteria:
      type:
      - string
      - 'null'
      format: date
      description: Start date
    Escalations:
      type: object
      required:
      - name
      - unique
      properties:
        name:
          type: string
          description: Name
        unique:
          type: boolean
          description: Unique
        id:
          type: string
          description: ID
        copiedFrom:
          type: string
          description: Copied From
        scenario:
          type: string
          description: Scenario ID
        tags:
          type: array
          items:
