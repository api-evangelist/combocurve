                                    headerRange:
                                      type: object
                                      properties:
                                        min:
                                          type: string
                                        max:
                                          type: string
                                weightDict:
                                  type: object
                                  properties:
                                    mode:
                                      type: string
                                    unit:
                                      type: string
                                    numRange:
                                      type: object
                                      properties:
                                        min:
                                          type: number
                                        max:
