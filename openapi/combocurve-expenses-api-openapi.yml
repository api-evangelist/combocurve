    FixedExpensesFields:
      type: object
      description: Fields that define fixed expense parameters and behavior
      required:
      - stopAtEconLimit
      - expenseBeforeFpd
      - escalationModel
      - affectEconLimit
      - deductBeforeSeveranceTax
      - deductBeforeAdValTax
      - dealTerms
      - calculation
      - rateType
      - rowsCalculationMethod
      properties:
        stopAtEconLimit:
          type: boolean
          description: Controls whether the expense stops when economic limit is reached
        expenseBeforeFpd:
          type: boolean
          description: Indicates if this expense applies before first production date
        escalationModel:
          type: string
          description: The model used for expense escalation over time
        affectEconLimit:
          type: boolean
          description: Specifies if this expense is included in the cut off calculation
        deductBeforeSeveranceTax:
          type: boolean
          description: Indicates if this expense is deducted before severance tax calculation
        deductBeforeAdValTax:
          type: boolean
          description: Indicates if this expense is deducted before ad valorem tax calculation
        dealTerms:
          type: number
          description: Paying Working Interest ÷ Earning Working Interest
        calculation:
          type: string
          enum:
          - wi
          - nri
          - lease_nri
          - one_minus_wi
          - one_minus_nri
          - wi_minus_one
          - nri_minus_one
          - one_minus_lease_nri
          - lease_nri_minus_one
          - 100_pct_wi
          description: The method used to calculate the expense based on interest types. Note - Projects imported from other platforms may default to 'nri'.
        rateType:
          type: string
          enum:
          - gross_well_head
          - gross_sales
          - net_sales
          description: The rate type used as the basis for expense calculation
        rowsCalculationMethod:
          type: string
          enum:
          - monotonic
          - non_monotonic
          description: Rate Rows Calculation Method
        description:
          type: string
          description: User-provided description of this expense
        cap:
          type: number
          description: The maximum value this expense can reach
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RowsFixedExpensesFields'
          description: Array of expense entries with values over time or conditions
  parameters:
    takeParam:
      name: take
      in: query
      description: max records to return
      schema:
        type: integer
        format: int32
        default: 25
        maximum: 200
        minimum: 1
    cursorParam:
      name: cursor
      in: query
      description: used in pagination to get the next page
      schema:
        type: string
    sortParam:
      name: sort
      in: query
      description: field to sort by, including + or - at the beginning for ascending or descending order, respectively
      schema:
        type: string
    skipParam:
      name: skip
      in: query
      description: number of items to skip
      schema:
        type: integer
        format: int32
        default: 0
  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
x-google-management:
  metrics:
  - name: read-request-rate
    displayName: Read Request Rate
    valueType: INT64
    metricKind: DELTA
  - name: write-request-rate
    displayName: Write Request Rate
    valueType: INT64
    metricKind: DELTA
  quota:
    limits:
    - name: read-request-rate-limit
      metric: read-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 800
    - name: write-request-rate-limit
      metric: write-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 200
