              example:
                name: ValidationError
                message: The field 'id' is required.
                details:
                  location: In body of request at position [0]
      tags:
      - Riskings
      x-google-quota:
        metricCosts:
          read-request-rate: 1
      summary: Get risking by id
      x-summary-source: derived
    delete:
      description: Delete the assumptions document that matches the given id scoped to projectId project.
      operationId: delete-riskings-by-id
      parameters:
      - in: path
        name: projectId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: id
        required: true
        description: ''
        schema:
          type: string
      responses:
        '204':
          description: OK
          headers:
            X-Delete-Count:
              description: The number of records that match the given filters and were deleted.
              schema:
                type: integer
        '400':
          description: Bad Request. There is something wrong with the request data.
      tags:
      - Riskings
      summary: Delete riskings by id
      x-summary-source: derived
