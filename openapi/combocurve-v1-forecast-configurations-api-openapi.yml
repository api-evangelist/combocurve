    delete:
      operationId: delete-forecast-configurations
      summary: delete-forecast-configurations
      tags:
      - v1 forecast-configurations
      description: Bulk delete by id. Pass one or more forecast configuration ids as repeated `id` query parameters. Configurations owned by other users return a `403` per-record multi-status entry; ids that do not exist return `404`.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: One or more forecast configuration ids to delete.
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '429':
          description: Too many requests - rate limit exceeded
