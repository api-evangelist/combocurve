openapi: 3.2.0
info:
  title: ComboCurve REST Well Comments API
  version: 1.0.0
servers:
- url: https://api.combocurve.com
security:
- api-key: []
  service-account-key: []
tags:
- name: WellComments
paths:
  /v1/well-comments:
    head:
      description: Returns metadata about the existing well comment documents.
      operationId: head-well-comments
      parameters:
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      - name: commentedAt
        in: query
        description: filter by commentedAt, can be used for incremental pull
        x-allow-parameter-operator: true
        schema:
          type: string
          format: date
      - name: forecast
        in: query
        description: filter by forecast
        schema:
          type: string
      - name: project
        in: query
        description: filter by project
        schema:
          type: string
      - name: well
        in: query
        description: filter by well
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: Indicates a typed relationship with another resource, where the relation type is defined by RFC 5988. We include the relationships next, prev, first and last, which can be used to move between pages of the list of results.
              schema:
                type: string
            X-Query-Count:
              description: The number of records in this resource. When filters are provided only matching records are counted.
              schema:
                type: integer
        '400':
          description: Bad Request. There is something wrong with the request data.
      tags:
      - WellComments
      summary: Head well comments
      x-summary-source: derived
    get:
      description: Returns a list of well comment documents.
      operationId: get-well-comments
      parameters:
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/cursorParam'
      - name: commentedAt
        in: query
        description: filter by commentedAt
        x-allow-parameter-operator: true
        schema:
          type: string
          format: date
      - name: forecast
        in: query
        description: filter by forecast
        schema:
          type: string
      - name: project
        in: query
        description: filter by project
        schema:
          type: string
      - name: well
        in: query
        description: filter by well
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: Indicates a typed relationship with another resource, where the relation type is defined by RFC 5988. We include the relationships next, prev, first and last, which can be used to move between pages of the list of results.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellCommentList'
              example:
              - commentedAt: '2020-07-27T17:52:28.791Z'
                commentedBy: 5f51a46dd1986a0012058e01
                forecast: 60a6c4a13f40ab00125086a7
                project: 6064c19e2c3fc60012909a50
                text: test
                well: 60e24fea5ea67a1bc4b857ae
        '400':
          description: Bad Request. There is something wrong with the request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                name: ValidationError
                message: The field 'id' is required.
                details:
                  location: In body of request at position [0]
      tags:
      - WellComments
      x-google-quota:
        metricCosts:
          read-request-rate: 1
      summary: Get well comments
      x-summary-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
    WellCommentList:
      type: array
      items:
        $ref: '#/components/schemas/WellComment'
      maxItems: 200
      example:
      - commentedAt: '2020-07-27T17:52:28.791Z'
        commentedBy: 5f51a46dd1986a0012058e01
        forecast: 60a6c4a13f40ab00125086a7
        project: 6064c19e2c3fc60012909a50
        text: test
        well: 60e24fea5ea67a1bc4b857ae
    WellComment:
      type: object
      properties:
        commentedAt:
          type: string
          format: date
          description: Well Comment Creation Date
        commentedBy:
          type: string
          description: Commented By
        forecast:
          type: string
          description: Forecast ID
        project:
          type: string
          description: Project ID
        text:
          type: string
          description: Text
        well:
          type: string
          description: Well ID
      example:
        commentedAt: '2020-07-27T17:52:28.791Z'
        commentedBy: 5f51a46dd1986a0012058e01
        forecast: 60a6c4a13f40ab00125086a7
        project: 6064c19e2c3fc60012909a50
        text: test
        well: 60e24fea5ea67a1bc4b857ae
  parameters:
    takeParam:
      name: take
      in: query
      description: max records to return
      schema:
        type: integer
        format: int32
        default: 25
        maximum: 200
        minimum: 1
    skipParam:
      name: skip
      in: query
      description: number of items to skip
      schema:
        type: integer
        format: int32
        default: 0
    cursorParam:
      name: cursor
      in: query
      description: used in pagination to get the next page
      schema:
        type: string
    sortParam:
      name: sort
      in: query
      description: field to sort by, including + or - at the beginning for ascending or descending order, respectively
      schema:
        type: string
  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
x-google-management:
  metrics:
  - name: read-request-rate
    displayName: Read Request Rate
    valueType: INT64
    metricKind: DELTA
  - name: write-request-rate
    displayName: Write Request Rate
    valueType: INT64
    metricKind: DELTA
  quota:
    limits:
    - name: read-request-rate-limit
      metric: read-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 800
    - name: write-request-rate-limit
      metric: write-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 200
