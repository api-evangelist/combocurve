name: ComboCurve
description: 'ComboCurve is an oil & gas well forecasting, type-curve, reserves and economics platform
  used by petroleum engineers, operators, private equity firms, investment banks, and mineral/royalty
  companies for acquisition-and-divestiture (A&D), upstream asset management, and reserves analysis. Its
  public REST API at https://api.combocurve.com exposes well headers, daily and monthly production data,
  directional surveys, forecasts, forecast configurations, econ-models (capex, expenses, differentials,
  escalations, depreciation, ownership reversions), economics runs, and asynchronous export jobs. Backed
  by Bessemer Venture Partners.'
