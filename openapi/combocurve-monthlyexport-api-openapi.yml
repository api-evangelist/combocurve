      - in: path
        name: scenarioId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: econRunId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: id
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParamBQ'
      - in: query
        name: concurrency
        description: maximum number of concurrent requests to make to the underlying datastore
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 10
          minimum: 1
      responses:
