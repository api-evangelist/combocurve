components:
  schemas:
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
    ForecastVolumes:
      type: object
      properties:
        project:
          type: string
          description: Project Id
        forecast:
          type: string
          description: Forecast Id
        forecastType:
          type: string
          enum:
          - deterministic
          - probabilistic
        well:
          type: string
          description: Well Id
        resolution:
          type: string
          description: Volume resolution
          enum:
          - daily
          - monthly
        phases:
          type: array
          items:
            $ref: '#/components/schemas/ForecastPhaseVolumes'
      example:
        project: 63bdcdf1dc401f0012613185
        forecast: 63bdce14dc401f00126131a7
        well: 63bdcdf56782656f8aaad644
        resolution: daily
    ForecastPhaseVolumes:
      type: object
      properties:
        phase:
          type: string
          description: Phase
          enum:
          - oil
          - gas
          - water
          - customNumber0
          - customNumber1
          - customNumber2
          - customNumber3
          - customNumber4
          - customNumber5
          - customNumber6
          - customNumber7
          - customNumber8
          - customNumber9
          - customNumber10
          - customNumber11
          - customNumber12
          - customNumber13
          - customNumber14
          - customNumber15
          - customNumber16
          - customNumber17
          - customNumber18
          - customNumber19
          - _project_custom_stream_0
          - _project_custom_stream_1
          - _project_custom_stream_2
          - _project_custom_stream_3
          - _project_custom_stream_4
          - _project_custom_stream_5
          - _project_custom_stream_6
          - _project_custom_stream_7
          - _project_custom_stream_8
          - _project_custom_stream_9
          - _project_custom_stream_10
          - _project_custom_stream_11
          - _project_custom_stream_12
          - _project_custom_stream_13
          - _project_custom_stream_14
          - _project_custom_stream_15
          - _project_custom_stream_16
          - _project_custom_stream_17
          - _project_custom_stream_18
          - _project_custom_stream_19
        series:
          type: array
          items:
            $ref: '#/components/schemas/ForecastSeriesVolumes'
        forecastOutputId:
          type: string
          description: Id of the forecast output used to generate the volumes
        ratio:
          $ref: '#/components/schemas/ForecastRatioVolumes'
      example:
        phase: gas
        forecastOutputId: 63bdce17dc401f0012614f34
    ForecastRatioVolumes:
      type: object
      properties:
        eur:
          type: number
          description: Eur
        basePhase:
          type: string
          description: Base Phase
          enum:
          - oil
          - gas
          - water
        startDate:
          type: string
          format: date
          description: Start Date
        endDate:
          type: string
          format: date
          description: End Date
        volumes:
          type: array
          items:
            type:
            - number
            - 'null'
      example:
        basePhase: oil
        startDate: '2020-03-15T00:00:00.000Z'
        endDate: '2025-03-15T00:00:00.000Z'
        eur: 610156.72736362
        volumes:
        - 0
        - 1
        - 2
    ForecastVolumesList:
      type: array
      items:
        $ref: '#/components/schemas/ForecastVolumes'
      maxItems: 200
      example:
      - project: 63bdcdf1dc401f0012613185
        forecast: 63bdce14dc401f00126131a7
        well: 63bdcdf56782656f8aaad644
        resolution: daily
        phases:
        - phase: gas
          forecastOutputId: 63bdce17dc401f0012614f34
          series:
          - series: best
            startDate: '2020-03-15T00:00:00.000Z'
            endDate: '2025-03-15T00:00:00.000Z'
            eur: 1980202.8287785284
            volumes:
            - 0
            - 1
            - 2
        - phase: oil
          forecastOutputId: 63bdce17dc401f0012614f34
          series:
          - series: best
            startDate: '2020-03-15T00:00:00.000Z'
            endDate: '2025-03-15T00:00:00.000Z'
            eur: 610156.72736362
            volumes:
            - 0
            - 1
            - 2
      - project: 63bdcdf1dc401f0012613185
        forecast: 63bdce14dc401f00126131a7
        well: 63bdcdf56782654efaaad6ca
        resolution: daily
        phases:
        - phase: gas
          forecastOutputId: 63bdce17dc401f00126150f5
          series:
          - series: best
            startDate: '2020-03-15T00:00:00.000Z'
            endDate: '2025-03-15T00:00:00.000Z'
            eur: 1980202.8287785284
            volumes:
            - 0
            - 1
            - 2
        - phase: oil
          forecastOutputId: 63bdce17dc401f00126150f5
          series:
          - series: best
            startDate: '2020-03-15T00:00:00.000Z'
            endDate: '2025-03-15T00:00:00.000Z'
            eur: 610156.72736362
            volumes:
            - 0
            - 1
            - 2
    ForecastSeriesVolumes:
      type: object
      properties:
        eur:
          type: number
          description: Eur
        series:
          type: string
          description: Series
          enum:
          - P10
          - P50
          - P90
          - best
        startDate:
          type: string
          format: date
          description: Start Date
        endDate:
          type: string
          format: date
          description: End Date
        volumes:
          type: array
          items:
            type:
            - number
            - 'null'
      example:
        series: best
        startDate: '2020-03-15T00:00:00.000Z'
        endDate: '2025-03-15T00:00:00.000Z'
        eur: 610156.72736362
        volumes:
        - 0
        - 1
        - 2
  parameters:
    takeParam:
      name: take
      in: query
      description: max records to return
      schema:
        type: integer
        format: int32
        default: 25
        maximum: 200
        minimum: 1
    skipParam:
      name: skip
      in: query
      description: number of items to skip
      schema:
        type: integer
        format: int32
        default: 0
    cursorParam:
      name: cursor
      in: query
      description: used in pagination to get the next page
      schema:
        type: string
    sortParam:
      name: sort
      in: query
      description: field to sort by, including + or - at the beginning for ascending or descending order, respectively
      schema:
        type: string
  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
