                          type: object
                          properties:
                            streams:
                              type: array
                              items:
                                type: string
                            configuration:
                              type: object
                              properties:
                                modelParameters:
                                  type: object
                                  properties:
                                    modelName:
                                      type: string
                                    b:
                                      type: object
                                      properties:
                                        min:
                                          type: number
                                        max:
                                          type: number
