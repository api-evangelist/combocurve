openapi: 3.2.0
info:
  title: ComboCurve REST Aries Forecast API
  version: 1.0.0
servers:
- url: https://api.combocurve.com
security:
- api-key: []
  service-account-key: []
tags:
- name: AriesForecast
paths:
  /v1/projects/{projectId}/forecasts/{forecastId}/aries:
    head:
      description: Returns metadata about the aries forecast documents scoped to projectId project and forecastId forecast.
      operationId: head-aries-forecast
      parameters:
      - in: path
        name: projectId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: forecastId
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      - name: well
        in: query
        description: filter by well
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request. There is something wrong with the request data.
      tags:
      - AriesForecast
      summary: Head aries forecast
      x-summary-source: derived
    get:
      description: Returns a list of aries forecast scoped to projectId project and forecastId forecast.
      operationId: get-aries-forecast
      parameters:
      - in: path
        name: projectId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: forecastId
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/cursorParam'
      - name: well
        in: query
        description: filter by well
        schema:
          type: string
      - name: pSeries
        in: query
        description: filter by pSeries
        schema:
          type: string
          enum:
          - P10
          - P50
          - P90
          - best
          default: best
      - name: startDate
        in: query
        description: filter by startDate, can be used for incremental pull
        schema:
          type: string
          format: date
      - name: selectedIdKey
        in: query
        description: filter by selectedIdKey
        schema:
          type: string
          enum:
          - api10
          - api12
          - api14
          - aries_id
          - chosenID
          - phdwin_id
          - well_name
          - well_name_well_number
          default: chosenID
      - name: endingCondition
        in: query
        description: filter by endingCondition
        schema:
          type: string
          enum:
          - absolute_date
          - ending_rate
          - months
          - years
          default: years
      - name: forecastUnit
        in: query
        description: filter by forecastUnit
        schema:
          type: string
          enum:
          - per_day
          - per_month
          default: per_day
      - name: toLife
        in: query
        description: filter by toLife
        schema:
          type: string
          enum:
          - 'yes'
          - 'no'
          default: 'no'
      - name: dataResolution
        in: query
        description: filter by dataResolution
        schema:
          type: string
          enum:
          - daily
          - monthly
          - same_as_forecast
          default: same_as_forecast
      - name: includeZeroForecast
        in: query
        description: filter by includeZeroForecast
        schema:
          type: boolean
      - name: forecastStartToLatestProd
        in: query
        description: filter by forecastStartToLatestProd
        schema:
          type: boolean
      - name: forecastHistoryMatch
        in: query
        description: filter by forecastHistoryMatch
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AriesForecastList'
              example:
              - well: 602d31de4477b92029913e56
                forecast:
                - PROPNUM: 1PDPOIL020
                  WELL NAME: 1PDPOIL235
                  WELL NUMBER: 1H
                  INPT ID: DTHrr7FMza
                  API10: '1234567890'
                  API12: '12345678901'
                  API14: '12345678901214'
                  CHOSEN ID: 1PDPOIL235
                  ARIES ID: 1PDPOIL235
                  PHDWIN ID: 9E5F5CC579867509254700023
                  SECTION: 4
                  SEQUENCE: 10
                  QUALIFIER: CC_QUAL
                  KEYWORD: CUMS
                  EXPRESSION: 0 0 0 0 0 0
                - PROPNUM: 1PDPOIL020
                  WELL NAME: 1PDPOIL236
                  WELL NUMBER: 2H
                  INPT ID: KMLrr7FMqq
                  API10: '1234567890'
                  API12: '12345678901'
                  API14: '12345678901214'
                  CHOSEN ID: 1PDPOIL236
                  ARIES ID: 1PDPOIL236
                  PHDWIN ID: 9E5F5CC579867509254700023
                  SECTION: 5
                  SEQUENCE: 20
                  QUALIFIER: CC_QUAL
                  KEYWORD: CUMS
                  EXPRESSION: 0 0 0 0 0 0
                - PROPNUM: 1PDPOIL020
                  WELL NAME: 1PDPOIL237
                  WELL NUMBER: 3H
                  INPT ID: LGHrr9FMhg
                  API10: '1234567890'
                  API12: '12345678901'
                  API14: '12345678901214'
                  CHOSEN ID: 1PDPOIL237
                  ARIES ID: 1PDPOIL237
                  PHDWIN ID: 9E5F5CC579867509254700023
                  SECTION: 6
                  SEQUENCE: 30
                  QUALIFIER: CC_QUAL
                  KEYWORD: CUMS
                  EXPRESSION: 0 0 0 0 0 0
        '400':
          description: Bad Request. There is something wrong with the request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                name: ValidationError
                message: The field 'id' is required.
                details:
                  location: In body of request at position [0]
      tags:
      - AriesForecast
      x-google-quota:
        metricCosts:
          read-request-rate: 1
      summary: Get aries forecast
      x-summary-source: derived
components:
  schemas:
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
    AriesForecast:
      type: object
      properties:
        forecast:
          type: array
          items:
            type: object
            properties:
              PROPNUM:
                type: string
                maxLength: 16384
                description: Propnum
              WELL NAME:
                type: string
                maxLength: 16384
                description: Well Name
              WELL NUMBER:
                type: string
                maxLength: 16384
                description: Well Number
              INPT ID:
                type: string
                maxLength: 16384
                description: Inpt ID
              API10:
                type: string
                maxLength: 16384
                description: Api10
              API12:
                type: string
                maxLength: 16384
                description: Api12
              API14:
                type: string
                maxLength: 16384
                description: Api14
              CHOSEN ID:
                type: string
                maxLength: 16384
                description: Chosen ID
              ARIES ID:
                type: string
                maxLength: 16384
                description: Aries ID
              PHDWIN ID:
                type: string
                maxLength: 16384
                description: Phdwin ID
              SECTION:
                type: integer
                description: Section
              SEQUENCE:
                type: integer
                description: Sequence
              QUALIFIER:
                type: string
                maxLength: 16384
                description: Qualifier
              KEYWORD:
                type: string
                maxLength: 16384
                description: Keyword
              EXPRESSION:
                type: string
                maxLength: 16384
                description: Expression
        well:
          type: string
          description: Well ID
      example:
        well: 602d31de4477b92029913e56
        forecast:
          PROPNUM: 1PDPOIL020
          WELL NAME: 1PDPOIL235
          WELL NUMBER: 1H
          INPT ID: DTHrr7FMza
          API10: '1234567890'
          API12: '12345678901'
          API14: '12345678901214'
          CHOSEN ID: 1PDPOIL235
          ARIES ID: 1PDPOIL235
          PHDWIN ID: 9E5F5CC579867509254700023
          SECTION: 4
          SEQUENCE: 10
          QUALIFIER: CC_QUAL
          KEYWORD: CUMS
          EXPRESSION: 0 0 0 0 0 0
    AriesForecastList:
      type: array
      items:
        $ref: '#/components/schemas/AriesForecast'
      maxItems: 1000
      example:
      - well: 602d31de4477b92029913e56
        forecast:
        - PROPNUM: 1PDPOIL020
          WELL NAME: 1PDPOIL235
          WELL NUMBER: 1H
          INPT ID: DTHrr7FMza
          API10: '1234567890'
          API12: '12345678901'
          API14: '12345678901214'
          CHOSEN ID: 1PDPOIL235
          ARIES ID: 1PDPOIL235
          PHDWIN ID: 9E5F5CC579867509254700023
          SECTION: 4
          SEQUENCE: 10
          QUALIFIER: CC_QUAL
          KEYWORD: CUMS
          EXPRESSION: 0 0 0 0 0 0
        - PROPNUM: 1PDPOIL020
          WELL NAME: 1PDPOIL236
          WELL NUMBER: 2H
          INPT ID: KMLrr7FMqq
          API10: '1234567890'
          API12: '12345678901'
          API14: '12345678901214'
          CHOSEN ID: 1PDPOIL236
          ARIES ID: 1PDPOIL236
          PHDWIN ID: 9E5F5CC579867509254700023
          SECTION: 5
          SEQUENCE: 20
          QUALIFIER: CC_QUAL
          KEYWORD: CUMS
          EXPRESSION: 0 0 0 0 0 0
        - PROPNUM: 1PDPOIL020
          WELL NAME: 1PDPOIL237
          WELL NUMBER: 3H
          INPT ID: LGHrr9FMhg
          API10: '1234567890'
          API12: '12345678901'
          API14: '12345678901214'
          CHOSEN ID: 1PDPOIL237
          ARIES ID: 1PDPOIL237
          PHDWIN ID: 9E5F5CC579867509254700023
          SECTION: 6
          SEQUENCE: 30
          QUALIFIER: CC_QUAL
          KEYWORD: CUMS
          EXPRESSION: 0 0 0 0 0 0
  parameters:
    takeParam:
      name: take
      in: query
      description: max records to return
      schema:
        type: integer
        format: int32
        default: 25
        maximum: 200
        minimum: 1
    skipParam:
      name: skip
      in: query
      description: number of items to skip
      schema:
        type: integer
        format: int32
        default: 0
    cursorParam:
      name: cursor
      in: query
      description: used in pagination to get the next page
      schema:
        type: string
    sortParam:
      name: sort
      in: query
      description: field to sort by, including + or - at the beginning for ascending or descending order, respectively
      schema:
        type: string
  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
x-google-management:
  metrics:
  - name: read-request-rate
    displayName: Read Request Rate
    valueType: INT64
    metricKind: DELTA
  - name: write-request-rate
    displayName: Write Request Rate
    valueType: INT64
    metricKind: DELTA
  quota:
    limits:
    - name: read-request-rate-limit
      metric: read-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 800
    - name: write-request-rate-limit
      metric: write-request-rate
      unit: 1/min/{project}
      values:
        STANDARD: 200
x-provenance:
  method: harvested
  publisher: ComboCurve
  source: https://storage.googleapis.com/beta-combocurve-api-docs/openapi-spec.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
