                  location: In body of request at position [0]
                - name: ValidationError
                  message: The field 'unique' is required.
                  location: In body of request at position [2]
                results:
                - status: Success
                  code: 200
                  name: test
                - status: Success
                  code: 200
                  name: test1
                failedCount: 2
                successCount: 2
      tags:
      - Riskings
      x-google-quota:
        metricCosts:
          write-request-rate: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskingsInputList'
        description: Riskings Model document(s) to replace/create. See RiskingsInputList.
      summary: Put riskings
      x-summary-source: derived
  /v1/projects/{projectId}/econ-models/riskings/{id}:
    get:
      description: Returns the riskings model document that matches the given id.
      operationId: get-risking-by-id
