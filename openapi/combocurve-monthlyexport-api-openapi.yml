openapi: 3.2.0
info:
  title: ComboCurve REST Monthly Export API
  version: 1.0.0
servers:
- url: https://api.combocurve.com
security:
- api-key: []
  service-account-key: []
tags:
- name: MonthlyExport
paths:
  /v1/projects/{projectId}/scenarios/{scenarioId}/econ-runs/{econRunId}/monthly-exports:
    head:
      description: Returns metadata about the existing econ monthly documents scoped to projectId project, scenarioId scenario and econRunId econ run.
      operationId: head-monthly-exports
      parameters:
      - in: path
        name: projectId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: scenarioId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: econRunId
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParamBQ'
      - name: comboName
        in: query
        description: filter by comboName
        schema:
          type: string
      - name: date
        in: query
        description: filter by date
        x-allow-parameter-operator: true
        schema:
          type: string
          format: date
      - name: well
        in: query
        description: filter by well
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: Indicates a typed relationship with another resource, where the relation type is defined by RFC 5988. We include the relationships next, prev, first and last, which can be used to move between pages of the list of results.
              schema:
                type: string
            X-Query-Count:
              description: The number of records in this resource. When filters are provided only matching records are counted.
              schema:
                type: integer
        '400':
          description: Bad Request. There is something wrong with the request data.
      tags:
      - MonthlyExport
      summary: Head monthly exports
      x-summary-source: derived
    post:
      description: Create an monthly export of econ monthly documents scoped to projectId project, scenarioId scenario and econRunId econ run. Response id should be used to get the results.
      operationId: post-monthly-exports
      parameters:
      - in: path
        name: projectId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: scenarioId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: econRunId
        required: true
        description: ''
        schema:
          type: string
      - name: comboName
        in: query
        description: filter by comboName
        schema:
          type: string
      - name: date
        in: query
        description: filter by date
        schema:
          type: string
          format: date
      - name: well
        in: query
        description: filter by well
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyExportJob'
              example:
                id: 7a0b236e-4a46-414d-bdf5-08de1d8adff7
        '400':
          description: Bad Request. There is something wrong with the request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                name: ValidationError
                message: The field 'id' is required.
                details:
                  location: In body of request at position [0]
      tags:
      - MonthlyExport
      x-google-quota:
        metricCosts:
          write-request-rate: 1
      summary: Post monthly exports
      x-summary-source: derived
  /v1/projects/{projectId}/scenarios/{scenarioId}/econ-runs/{econRunId}/monthly-exports/{id}:
