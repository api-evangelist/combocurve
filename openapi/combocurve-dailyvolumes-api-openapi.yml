openapi: 3.2.0
info:
  title: ComboCurve REST Daily Volumes API
  version: 1.0.0
servers:
- url: https://api.combocurve.com
security:
- api-key: []
  service-account-key: []
tags:
- name: DailyVolumes
paths:
  /v1/projects/{projectId}/forecasts/{forecastId}/daily-volumes:
    head:
      description: Returns metadata about the existing forecast volumes scoped to projectId project, forecastId forecast, and well.
      operationId: head-forecast-daily-volumes
      parameters:
      - in: path
        name: projectId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: forecastId
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      - name: well
        in: query
        description: filter by well
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: Indicates a typed relationship with another resource, where the relation type is defined by RFC 5988. We include the relationships next, prev, first and last, which can be used to move between pages of the list of results.
              schema:
                type: string
            X-Query-Count:
              description: The number of records in this resource. When filters are provided only matching records are counted.
              schema:
                type: integer
        '400':
          description: Bad Request. There is something wrong with the request data.
      tags:
      - DailyVolumes
      summary: Head forecast daily volumes
      x-summary-source: derived
    get:
      description: Returns a list of forecast volumes scoped to projectId project, forecastId forecast, and well.
      operationId: get-forecast-daily-volumes
      parameters:
      - in: path
        name: projectId
        required: true
        description: ''
        schema:
          type: string
      - in: path
        name: forecastId
        required: true
        description: ''
        schema:
          type: string
      - $ref: '#/components/parameters/skipParam'
      - $ref: '#/components/parameters/takeParam'
      - $ref: '#/components/parameters/sortParam'
      - $ref: '#/components/parameters/cursorParam'
      - name: well
        in: query
        description: filter by well
        schema:
          type: string
      - name: startDate
        in: query
        description: filter by startDate. Returns all records with a startDate greater than or equal to the specified value.
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: filter by endDate. Returns all records with a endDate less than or equal to the specified value.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: Indicates a typed relationship with another resource, where the relation type is defined by RFC 5988. We include the relationships next, prev, first and last, which can be used to move between pages of the list of results.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastVolumesList'
              example:
              - project: 63bdcdf1dc401f0012613185
                forecast: 63bdce14dc401f00126131a7
                well: 63bdcdf56782656f8aaad644
                resolution: daily
                phases:
                - phase: gas
                  forecastOutputId: 63bdce17dc401f0012614f34
                  series:
                  - series: best
                    startDate: '2020-03-15T00:00:00.000Z'
                    endDate: '2025-03-15T00:00:00.000Z'
                    eur: 1980202.8287785284
                    volumes:
                    - 0
                    - 1
                    - 2
                - phase: oil
                  forecastOutputId: 63bdce17dc401f0012614f34
                  series:
                  - series: best
                    startDate: '2020-03-15T00:00:00.000Z'
                    endDate: '2025-03-15T00:00:00.000Z'
                    eur: 610156.72736362
                    volumes:
                    - 0
                    - 1
                    - 2
              - project: 63bdcdf1dc401f0012613185
                forecast: 63bdce14dc401f00126131a7
                well: 63bdcdf56782654efaaad6ca
                resolution: daily
                phases:
                - phase: gas
                  forecastOutputId: 63bdce17dc401f00126150f5
                  series:
                  - series: best
                    startDate: '2020-03-15T00:00:00.000Z'
                    endDate: '2025-03-15T00:00:00.000Z'
                    eur: 1980202.8287785284
                    volumes:
                    - 0
                    - 1
                    - 2
                - phase: oil
                  forecastOutputId: 63bdce17dc401f00126150f5
                  series:
                  - series: best
                    startDate: '2020-03-15T00:00:00.000Z'
                    endDate: '2025-03-15T00:00:00.000Z'
                    eur: 610156.72736362
                    volumes:
                    - 0
                    - 1
                    - 2
        '400':
          description: Bad Request. There is something wrong with the request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                name: ValidationError
                message: The field 'id' is required.
                details:
                  location: In body of request at position [0]
      tags:
      - DailyVolumes
      x-google-quota:
        metricCosts:
          read-request-rate: 1
      summary: Get forecast daily volumes
      x-summary-source: derived
