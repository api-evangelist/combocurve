components:
  schemas:
    Error:
      type: object
      properties:
        name:
          type: string
          description: The kind of error.
        message:
          type: string
          description: A human-readable description of the problem.
        details:
          type: object
          properties:
            location:
              type: string
              description: The location in the request data that contains the invalid value.
      example:
        name: ValidationError
        message: The field 'id' is required.
        details:
          location: In body of request at position [0]
    EconRunList:
      type: array
      items:
        $ref: '#/components/schemas/EconRun'
      maxItems: 200
      example:
      - id: 5e5981b9e23dae0012624d72
        runDate: '2020-06-08T19:14:22.012Z'
        status: complete
        tags:
        - name: Test tag
          description: Test tag description
        project: 622d373726543548d040cb86
        scenario: 622d373724539878d040cb85
        outputParams:
          prodAnalyticsType: calendar
      - id: 5e9999e23dae0012243e99
        runDate: '2020-06-08T19:14:22.012Z'
        status: complete
        tags:
        - name: Test tag
          description: Test tag description
        project: 62b1c13e2750130012ee4515
        scenario: 62befdc048cddf001246d674
        outputParams:
          prodAnalyticsType: calendar
    EconRun:
      type: object
      properties:
        id:
          type: string
          description: ID
        project:
          type: string
          description: Project ID
        runDate:
          type: string
          format: date
          description: Run Date
        scenario:
          type: string
          description: Scenario ID
        status:
          type: string
          description: Status
        tags:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 16384
                description: Name
              description:
                type: string
                maxLength: 16384
                description: Description
        outputParams:
          type: object
          properties:
            prodAnalyticsType:
              type: string
              enum:
              - calendar
              - daysOn
              - none
              description: Production Analytics Type
      example:
        id: 5e5981b9e23dae0012624d72
        runDate: '2020-06-08T19:14:22.012Z'
        status: complete
        tags:
        - name: Test tag
          description: Test tag description
        project: 622d373726543548d040cb86
        scenario: 622d373724539878d040cb85
        outputParams:
          prodAnalyticsType: calendar
  parameters:
    takeParam:
      name: take
      in: query
      description: max records to return
      schema:
        type: integer
        format: int32
        default: 25
        maximum: 200
        minimum: 1
    skipParam:
      name: skip
      in: query
      description: number of items to skip
      schema:
        type: integer
        format: int32
        default: 0
    cursorParam:
      name: cursor
      in: query
      description: used in pagination to get the next page
      schema:
        type: string
    sortParam:
      name: sort
      in: query
      description: field to sort by, including + or - at the beginning for ascending or descending order, respectively
      schema:
        type: string
  securitySchemes:
    api-key:
      type: apiKey
      name: x-api-key
      in: header
